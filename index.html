<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VanSurv - Vampire Survivors Clone (JS移植版)</title>
<link rel="icon" href="assets/favicon.ico">
<style>
  @font-face {
    font-family: 'NotoSansJP';
    src: url('assets/fonts/NotoSansJP-VariableFont_wght.ttf') format('truetype');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #111; color: #eee; font-family: 'NotoSansJP', sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* 仮想解像度 1280x720 のステージ。実ウィンドウに合わせて等比スケールされる */
  #stage { position: relative; width: 1280px; height: 720px; transform-origin: center center; flex: none; }
  #stage canvas { display: block; image-rendering: pixelated; }
  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  #hud-top { position: absolute; top: 8px; left: 10px; width: 460px; }
  .bar { position: relative; height: 18px; background: rgba(0,0,0,0.6); border: 1px solid #888; border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .bar > .fill { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width 0.1s linear; }
  #hp-bar { background: #3ecf5a; }
  #xp-bar { background: #35a7ff; }
  .bar > .bar-text { position: absolute; inset: 0; font-size: 12px; line-height: 18px; text-align: center; color: #fff; text-shadow: 0 1px 2px #000; }
  #lv-text { font-weight: bold; color: #ffd700; }
  #hud-center { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: bold; text-shadow: 0 2px 4px #000; }
  #hud-right { position: absolute; top: 8px; right: 10px; text-align: right; font-size: 15px; text-shadow: 0 1px 2px #000; }
  #minimap { position: absolute; top: 64px; right: 10px; width: 220px; height: 124px; }
  #hud-bottom { position: absolute; left: 10px; bottom: 8px; display: flex; align-items: flex-end; gap: 12px; }
  #items-row { display: flex; gap: 4px; }
  .inv-icon { position: relative; width: 40px; height: 40px; background: rgba(0,0,0,0.55); border-radius: 4px; }
  .inv-icon img { width: 100%; height: 100%; image-rendering: pixelated; }
  .inv-icon span { position: absolute; right: 1px; bottom: 0; font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; }
  .inv-icon.weapon { border: 2px solid #c9a227; }
  .inv-icon.sub { border: 2px solid #3a6fd8; }
  #fps-text { font-size: 12px; color: #aaa; }
  /* ---------- メニュー共通 ---------- */
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.65); z-index: 10; }
  .overlay h1 { font-size: 34px; margin-bottom: 18px; text-shadow: 0 2px 6px #000; }
  .overlay .hint { margin-top: 16px; font-size: 13px; color: #bbb; }
  #menu-grid.grid3x3 { display: grid; grid-template-columns: repeat(3, 190px); gap: 12px; }
  #menu-grid.rowcards { display: flex; gap: 12px; }
  .card { width: 190px; min-height: 150px; background: #1d2733; border: 2px solid #556; border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; }
  .card img { width: 48px; height: 48px; image-rendering: pixelated; }
  .card.selected { border-color: #ffd700; background: #2a3646; box-shadow: 0 0 14px rgba(255,215,0,0.45); }
  .card-title { font-size: 17px; font-weight: bold; margin: 6px 0 2px; }
  .card-badge { font-size: 12px; color: #7dd87d; }
  .card-desc { font-size: 12px; color: #c5cede; line-height: 1.5; margin-top: 6px; }
  /* ---------- エンド画面 ---------- */
  #end-stats table { border-collapse: collapse; margin: 6px auto; font-size: 16px; }
  #end-stats td { padding: 3px 14px; }
  #end-stats td:first-child { color: #aab; text-align: right; }
  .dmg-title { margin-top: 10px; font-size: 14px; color: #aab; text-align: center; }
  #end-buttons { display: flex; gap: 24px; margin-top: 22px; }
  .end-btn { width: 220px; height: 48px; font-size: 18px; font-family: inherit; color: #fff; background: #444; border: 2px solid #777; border-radius: 8px; cursor: pointer; }
  .end-btn.continue { background: #2c7a2c; }
  .end-btn.selected { border-color: #fff; box-shadow: 0 0 12px rgba(255,255,255,0.5); }
  /* ---------- その他 ---------- */
  #banner { position: absolute; top: 90px; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: bold; color: #ffdf5e; text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 6; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #111; z-index: 20; }
  .load-error { color: #f66; max-width: 700px; line-height: 1.7; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <!-- Pixi の canvas は game.js がここへ追加する -->
    <div id="hud">
      <div id="hud-top">
        <div class="bar"><div class="fill" id="hp-bar"></div><div class="bar-text" id="hp-text">HP</div></div>
        <div class="bar"><div class="fill" id="xp-bar"></div><div class="bar-text"><span id="lv-text">Lv 1</span></div></div>
      </div>
      <div id="hud-center"><span id="timer-text">10:00</span></div>
      <div id="hud-right">
        <div id="kills-text">撃破 0</div>
        <div id="money-text">0 G</div>
      </div>
      <canvas id="minimap" width="220" height="124"></canvas>
      <div id="hud-bottom">
        <div id="items-row"></div>
        <div id="fps-text"></div>
      </div>
    </div>
    <div id="banner"></div>
    <div id="menu" class="overlay">
      <h1 id="menu-title">武器を選択</h1>
      <div id="menu-grid"></div>
      <div class="hint" id="menu-hint"></div>
    </div>
    <div id="endscreen" class="overlay">
      <h1 id="end-title">GAME OVER</h1>
      <div id="end-stats"></div>
      <div id="end-buttons"></div>
      <div class="hint">←→ で選択、Enter で決定 / クリックでも選べます</div>
    </div>
    <div id="loading">読み込み中…</div>
  </div>
</div>

<script src="vendor/pixi.min.js"></script>
<script src="js/constants.js"></script>
<script src="js/data.js"></script>
<script src="js/mapchips.js"></script>
<script src="js/stage.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/weapons.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/items.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
