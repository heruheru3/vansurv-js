<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VanSurv - Vampire Survivors Clone (JS移植版)</title>
<link rel="icon" href="assets/favicon.ico">
<style>
  @font-face {
    font-family: 'NotoSansJP';
    src: url('assets/fonts/NotoSansJP-VariableFont_wght.ttf') format('truetype');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #111; color: #eee; font-family: 'NotoSansJP', sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* ステージはウインドウ全体。ゲームの解像度そのものがウインドウサイズになる
     （縦画面なら縦画面、正方形なら正方形、そのままの形で遊べる） */
  /* iPhone Safari では 100vh がツールバー裏まで含んだ高さになり下部のUIが隠れるため、
     実際に見えている高さに追従する dvh を優先する（未対応環境は vh にフォールバック） */
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  #stage canvas { display: block; image-rendering: pixelated; }
  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  #hud-top { position: absolute; top: 8px; left: 10px; width: min(460px, 52vw); }
  .bar { position: relative; height: 18px; background: rgba(0,0,0,0.6); border: 1px solid #888; border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .bar > .fill { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width 0.1s linear; }
  #hp-bar { background: #3ecf5a; }
  #xp-bar { background: #35a7ff; }
  .bar > .bar-text { position: absolute; inset: 0; font-size: 12px; line-height: 18px; text-align: center; color: #fff; text-shadow: 0 1px 2px #000; }
  #lv-text { font-weight: bold; color: #ffd700; }
  #hud-center { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: bold; text-shadow: 0 2px 4px #000; }
  #hud-right { position: absolute; top: 8px; right: 10px; text-align: right; font-size: 15px; text-shadow: 0 1px 2px #000; }
  #minimap { position: absolute; top: 64px; right: 10px; width: 220px; height: 124px; }
  #hud-bottom { position: absolute; left: 10px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 12px; }
  #items-row { display: flex; gap: 4px; }
  .inv-icon { position: relative; width: 40px; height: 40px; background: rgba(0,0,0,0.55); border-radius: 4px; }
  .inv-icon img { width: 100%; height: 100%; image-rendering: pixelated; }
  .inv-icon span { position: absolute; right: 1px; bottom: 0; font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; }
  .inv-icon.weapon { border: 2px solid #c9a227; }
  .inv-icon.sub { border: 2px solid #3a6fd8; }
  #fps-text { font-size: 12px; color: #aaa; }
  #se-toggle { position: absolute; right: 10px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); pointer-events: auto;
    font-family: inherit; font-size: 12px; color: #ddd; background: rgba(0,0,0,0.55);
    border: 1px solid #888; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  #bgm-toggle { position: absolute; right: 84px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); pointer-events: auto;
    font-family: inherit; font-size: 12px; color: #ddd; background: rgba(0,0,0,0.55);
    border: 1px solid #888; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  /* ---------- メニュー共通 ---------- */
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.65); z-index: 10; }
  .overlay h1 { font-size: 34px; margin-bottom: 18px; text-shadow: 0 2px 6px #000; }
  .overlay .hint { margin-top: 16px; font-size: 13px; color: #bbb; }
  #menu-grid.grid3x3 { display: grid; grid-template-columns: repeat(3, 190px); gap: 12px; }
  #menu-grid.rowcards { display: flex; gap: 12px; }
  .card { width: 190px; min-height: 150px; background: #1d2733; border: 2px solid #556; border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; }
  .card img { width: 48px; height: 48px; image-rendering: pixelated; }
  .card.selected { border-color: #ffd700; background: #2a3646; box-shadow: 0 0 14px rgba(255,215,0,0.45); }
  .card-title { font-size: 17px; font-weight: bold; margin: 6px 0 2px; }
  .card-badge { font-size: 12px; color: #7dd87d; }
  .card-desc { font-size: 12px; color: #c5cede; line-height: 1.5; margin-top: 6px; }
  /* ---------- エンド画面（原作 ui/ui.py のリザルト画面を再現） ----------
     原作はゲーム画面の上に半透明の白パネルを重ねる。暗幕は敷かない。
     座標は仮想解像度 1280x720 基準（原作 draw_ui / get_end_button_rects と同じ）。 */
  #endscreen.result-overlay { display: none; background: transparent; }
  #end-title { position: absolute; left: 0; right: 0; top: 0; height: 40px; line-height: 40px;
    text-align: center; font-size: 34px; font-weight: bold; color: #ff0000; text-shadow: 0 2px 6px #000; }
  #endscreen.clear #end-title { top: 20px; color: #00ff00; }
  #end-time { position: absolute; left: 0; right: 0; top: 50px; height: 20px; line-height: 20px;
    text-align: center; font-size: 20px; color: #ff0000; text-shadow: 0 2px 4px #000; }
  #endscreen.clear #end-time { top: 70px; color: #00ff00; }
  /* ダメージ統計が空のときは原作と同じくタイトル/タイムを少し下げる */
  #endscreen.no-damage #end-title { top: 20px; }
  #endscreen.no-damage #end-time { top: 70px; }
  #endscreen.clear.no-damage #end-time { top: 50px; }
  /* ESC ポーズ（原作 force_ended の GAME PAUSED 表示）。タイトルと時間は黄色 */
  #endscreen.paused #end-title { color: #ffff00; }
  #endscreen.paused #end-time { color: #ffff00; }
  .result-panel { position: absolute; display: flex; flex-direction: column;
    background: rgba(255,255,255,0.5); border: 3px solid #000; color: #000; }
  #result-weapon-panel { left: 200px; top: 110px; width: 880px; height: 250px; padding: 5px 21px; }
  #result-enemy-panel { left: 360px; top: 370px; width: 560px; height: 130px; padding: 5px 20px; }
  #result-boss-panel { left: 290px; top: 510px; width: 700px; height: 110px; padding: 5px 20px; }
  .result-head { display: flex; height: 24px; align-items: center; font-size: 20px; flex: none; }
  /* 原作はヘッダーだけ本文の数値列より左に描かれる（table_x+280 / +560） */
  .result-head .col-weapon { width: 256px; }
  .result-head .col-damage { width: 280px; }
  .col-weapon { width: 296px; }
  .col-damage { width: 260px; }
  .col-dps { flex: 1; }
  #result-weapon-rows { display: flex; flex-direction: column; margin-top: 18px; flex: 1; overflow: hidden; }
  .result-row { display: flex; height: 30px; align-items: center; font-size: 16px; flex: none; }
  .result-row .col-weapon { display: flex; align-items: center; }
  .result-icon { width: 24px; height: 24px; margin-right: 8px; object-fit: contain;
    image-rendering: pixelated; background: rgba(120,120,120,0.35); }
  #result-total-row { margin-top: auto; }
  .result-panel-title { font-size: 16px; line-height: 20px; flex: none; }
  #result-enemy-grid { display: grid; grid-template-columns: repeat(10, 1fr);
    grid-template-rows: 45px 45px; gap: 0; margin-top: 10px; flex: 1; align-items: start; }
  .enemy-cell { display: flex; flex-direction: column; align-items: center; }
  .enemy-cell img { width: 24px; height: 24px; object-fit: contain; image-rendering: pixelated; }
  .enemy-cell .enemy-count { font-size: 12px; line-height: 14px; color: #000; }
  .enemy-cell .enemy-count.zero { color: #666; }
  #result-boss-row { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex: 1; }
  .boss-cell { position: relative; width: 60px; height: 60px; flex: none; }
  .boss-cell img { width: 60px; height: 60px; object-fit: contain; image-rendering: pixelated; }
  .boss-check { position: absolute; right: 5px; top: 5px; width: 20px; height: 20px;
    border-radius: 50%; border: 2px solid #000; background: #00ff00; color: #fff;
    font-size: 14px; line-height: 20px; text-align: center; font-weight: bold;
    text-shadow: 0 1px 2px #000; box-sizing: content-box; }
  #end-buttons { position: absolute; left: 0; right: 0; top: 632px; display: flex;
    justify-content: center; gap: 24px; }
  .end-btn { width: 220px; height: 48px; font-size: 18px; font-family: inherit; color: #fff;
    background: #282828; border: 3px solid transparent; border-radius: 8px; cursor: pointer; }
  .end-btn.restart.selected { background: #505050; border-color: #fff; font-size: 20px;
    box-shadow: 0 0 10px rgba(0,0,0,0.6); }
  .end-btn.continue { background: #28a028; }
  .end-btn.continue.selected { background: #3cc83c; border-color: #fff; font-size: 20px;
    box-shadow: 0 0 10px rgba(0,0,0,0.6); }
  /* リザルト画面は 1280x720 基準の絶対配置のまま、内側ステージごと
     ウインドウに収まるよう拡縮して表示する（ui.js の layoutResultStage） */
  #result-stage { position: absolute; width: 1280px; height: 720px; transform-origin: 0 0; }
  /* ---------- バーチャルパッド（タッチ操作） ---------- */
  #vpad { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px;
    border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
    background: rgba(255,255,255,0.08); display: none; z-index: 8; pointer-events: none; }
  #vpad-knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px;
    margin: -24px 0 0 -24px; border-radius: 50%;
    background: rgba(255,255,255,0.35); border: 2px solid rgba(255,255,255,0.6); }
  /* ---------- 小さい画面向けのUI調整（重なり・極小化の防止） ---------- */
  .overlay { padding: 12px; overflow-y: auto; }
  /* レベルアップ等の横並びカードは幅を均一にする（内容で幅がバラつかないよう grid 化） */
  #menu-grid.rowcards { display: grid; grid-template-columns: repeat(auto-fit, 190px);
    justify-content: center; gap: 12px; width: 100%; }
  @media (max-width: 1080px) {
    /* 中央タイマーが左上のHP/XPバーと重ならないよう、バーの下へ逃がす */
    #hud-center { top: 52px; }
  }
  @media (max-width: 760px) {
    #minimap { width: 140px; height: 79px; top: 58px; }
    #hud-right { font-size: 12px; }
    #hud-center { font-size: 20px; }
    #hud-top { width: min(300px, 48vw); }
    .overlay h1 { font-size: 24px; margin-bottom: 12px; }
    #menu-grid.grid3x3 { grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
    #menu-grid.rowcards { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
    .card { width: auto; min-height: 0; padding: 8px; }
    .card img { width: 36px; height: 36px; }
    .card-title { font-size: 14px; }
    .card-desc { font-size: 11px; line-height: 1.4; }
    #banner { font-size: 22px; top: 64px; }
  }
  @media (max-width: 460px) {
    #minimap { width: 110px; height: 62px; top: 52px; }
    .bar { height: 14px; }
    .bar > .bar-text { font-size: 10px; line-height: 14px; }
    .inv-icon { width: 30px; height: 30px; }
  }
  /* ---------- その他 ---------- */
  #banner { position: absolute; top: 90px; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: bold; color: #ffdf5e; text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 6; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #111; z-index: 20; }
  .load-error { color: #f66; max-width: 700px; line-height: 1.7; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <!-- Pixi の canvas は game.js がここへ追加する -->
    <div id="hud">
      <div id="hud-top">
        <div class="bar"><div class="fill" id="hp-bar"></div><div class="bar-text" id="hp-text">HP</div></div>
        <div class="bar"><div class="fill" id="xp-bar"></div><div class="bar-text"><span id="lv-text">Lv 1</span></div></div>
      </div>
      <div id="hud-center"><span id="timer-text">10:00</span></div>
      <div id="hud-right">
        <div id="kills-text">撃破 0</div>
        <div id="money-text">0 G</div>
      </div>
      <canvas id="minimap" width="220" height="124"></canvas>
      <div id="hud-bottom">
        <div id="items-row"></div>
        <div id="fps-text"></div>
      </div>
      <button id="se-toggle" type="button">SE ON</button>
      <button id="bgm-toggle" type="button">BGM ON</button>
    </div>
    <div id="banner"></div>
    <div id="vpad"><div id="vpad-knob"></div></div>
    <div id="menu" class="overlay">
      <h1 id="menu-title">武器を選択</h1>
      <div id="menu-grid"></div>
      <div class="hint" id="menu-hint"></div>
    </div>
    <div id="endscreen" class="overlay result-overlay">
     <div id="result-stage">
      <div id="end-title">GAME OVER</div>
      <div id="end-time">Survival Time: 0s</div>
      <div id="result-weapon-panel" class="result-panel">
        <div class="result-head">
          <span class="col-weapon">Weapon</span>
          <span class="col-damage">Total Damage</span>
          <span class="col-dps">DPS</span>
        </div>
        <div id="result-weapon-rows"></div>
        <div id="result-total-row" class="result-row">
          <span class="col-weapon">Total</span>
          <span class="col-damage" id="result-total-damage">0</span>
          <span class="col-dps" id="result-total-dps">0.0</span>
        </div>
      </div>
      <div id="result-enemy-panel" class="result-panel">
        <div class="result-panel-title">Enemies Defeated</div>
        <div id="result-enemy-grid"></div>
      </div>
      <div id="result-boss-panel" class="result-panel">
        <div class="result-panel-title">Boss Defeated</div>
        <div id="result-boss-row"></div>
      </div>
      <div id="end-buttons"></div>
     </div>
    </div>
    <div id="loading">読み込み中…</div>
  </div>
</div>

<script src="vendor/pixi.min.js"></script>
<script src="js/constants.js"></script>
<script src="js/data.js"></script>
<script src="js/mapchips.js"></script>
<script src="js/stage.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/weapons.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/items.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
